<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,black,rgb(253,76,76),orange,rgb(253,76,76),black);
}

.container{
    width:350px;
    background:white;
    margin:80px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px black;
}

h1{
    text-align:center;
    color:#1e3c72;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0 18px;
    border:1px solid gray;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#1e3c72;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#16325c;
}
</style>

</head>
<body>

<div class="container">

<h1>Forgot Password</h1>

<form>

<label for="userid">Email / Mobile Number</label>
<input type="text" id="userid" placeholder="Enter Email or Mobile Number" required>

<label for="newpassword">New Password</label>
<input type="password" id="newpassword" placeholder="Enter New Password" required>

<label for="confirmpassword">Confirm Password</label>
<input type="password" id="confirmpassword" placeholder="Confirm Password" required>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
