<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>


    <div class="butni">
        <input type="text" placeholder="0" id="inputbox">
        <div>
            
            <button class="alcbtn">C</button>
            <button class="delbtn">⌫</button>
            <button class="perbtn">%</button>
            <button class="divbtn">/</button>
            
        </div>


        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="multbtn">*</button>
        </div>


        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="minbtn">-</button>
        </div>


        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="addbtn">+</button>
        </div>


        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="eqbtn">=</button>
        </div>
    </div>
    


<div class="calculator2">

  <div class="top-bar">
    <button class="menu-btn" onclick="toggleMenu()">⋮</button>

    <div id="menuOptions" class="menu-options">
      <p onclick="showHistory()">History</p>
      <p onclick="clearHistory()">Clear History</p>
    </div>
  </div>

  <input type="text" id="display">

</div>

</body>
</html>
