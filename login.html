<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,black,rgb(253,76,76),orange,rgb(253,76,76),black);
}

h1{
    text-align:center;
    color:white;
    margin-top:40px;
}

form{
    width:350px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px black;
}

label{
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid gray;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:blue;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:darkblue;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    margin:10px;
    color:blue;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>Login Page</h1>

<form>

<label for="username">User Name</label>
<input type="text" id="username" placeholder="Enter your username" required>

<label for="password">Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<button type="submit">Login</button>

<div class="links">
<a href="new account.html" target="_blank">Create New Account</a>
<br><br>
<a href="forget password.html" target="_blank">Forgot Password?</a>
</div>

</form>

</body>
</html>
